<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mega WPL Auction 150</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0c0f1d; color: #fff; text-align: center; margin: 0; padding: 12px; }
    .container { max-width: 500px; margin: auto; }
    .card { background: #161b30; border-radius: 14px; padding: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 12px; border: 1px solid #272f4e; }
    h1 { color: #f39c12; margin: 5px 0 12px 0; font-size: 22px; }
    input, select { width: calc(100% - 24px); padding: 10px; margin: 6px 0; border-radius: 8px; border: 1px solid #3b4771; background: #090c17; color: #fff; font-size: 15px; }
    button { background: #27ae60; border: none; padding: 12px; color: #fff; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 6px; }
    button.secondary { background: #2980b9; }
    button.sold-btn { background: #e67e22; width: 48%; display: inline-block; }
    button.unsold-btn { background: #c0392b; width: 48%; display: inline-block; }
    button:disabled { background: #444; cursor: not-allowed; }
    .player-avatar { width: 100px; height: 100px; border-radius: 50%; background: #212946; margin: 8px auto; border: 3px solid #f39c12; display: block; object-fit: cover; }
    .badge { background: #e84393; padding: 3px 10px; border-radius: 10px; font-weight: bold; font-size: 12px; }
    .badge-os { background: #8e44ad; }
    .badge-ind { background: #27ae60; }
    .price { font-size: 28px; color: #2ecc71; font-weight: bold; margin: 6px 0; }
    .timer-badge { font-size: 20px; font-weight: bold; color: #e74c3c; background: #2d131a; padding: 4px 12px; border-radius: 12px; display: inline-block; margin-bottom: 8px; }
    .host-panel { background: #22142e; border: 1px dashed #9b59b6; border-radius: 10px; padding: 8px; margin-top: 10px; }
    .squad-box { text-align: left; max-height: 140px; overflow-y: auto; font-size: 12px; color: #bbb; background: #0c0f1d; padding: 8px; border-radius: 6px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏏 MEGA WPL AUCTION</h1>

    <!-- 1. LOBBY SCREEN -->
    <div class="card" id="lobby-screen">
      <h3>Auction Lobby</h3>
      <input type="text" id="team-name" placeholder="Team Name (e.g. MI, RCB, DC)">
      <input type="text" id="room-input" placeholder="Room Code (e.g. WPL777)">
      
      <label style="display:block; text-align:left; margin-top:8px; font-size:13px; color:#aaa;">Kitni Teams Khelenge?</label>
      <select id="max-teams">
        <option value="2">2 Teams (32 Players Pool)</option>
        <option value="3">3 Teams (48 Players Pool)</option>
        <option value="4">4 Teams (64 Players Pool)</option>
        <option value="5">5 Teams (80 Players Pool)</option>
      </select>

      <button onclick="createRoom()">Create Room</button>
      <button class="secondary" onclick="joinRoom()">Join Room</button>
    </div>

    <!-- 2. AUCTION SCREEN -->
    <div id="game-screen" class="hidden">
      <div id="status" style="color: #f1c40f; font-weight: bold; margin-bottom: 8px;">Waiting for all teams...</div>

      <div class="card">
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: #aaa;">
          <span id="player-progress">Player 0/0</span>
          <span class="timer-badge">⏳ <span id="timer">10</span>s</span>
        </div>

        <img id="player-img" class="player-avatar" src="" alt="Player">
        <span class="badge" id="player-role">Role</span>
        <span class="badge badge-ind" id="player-country">IND</span>

        <h2 id="player-name" style="margin: 6px 0;">--</h2>
        <div class="price">₹ <span id="current-bid">0</span> Lakhs</div>
        <div style="margin-bottom: 6px; font-size: 14px;">Current Highest: <strong id="bid-leader" style="color: #f39c12;">None</strong></div>
        
        <button id="bid-btn" onclick="sendBid()">BID (+ ₹10L)</button>

        <!-- HOST CONTROLS -->
        <div id="host-controls" class="host-panel hidden">
          <div style="font-size: 12px; color: #9b59b6; margin-bottom: 5px;">👑 Host Controls</div>
          <div style="display: flex; justify-content: space-between;">
            <button class="sold-btn" onclick="soldPlayer()">SOLD ✅</button>
            <button class="unsold-btn" onclick="unsoldPlayer()">UNSOLD ❌</button>
          </div>
        </div>
      </div>

      <!-- TEAM STATS & SQUAD -->
      <div class="card">
        <div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px;">
          <div>Purse: <strong id="my-purse" style="color:#2ecc71;">₹ 1200L</strong></div>
          <div>Squad: <strong id="squad-count" style="color:#f39c12;">0/16</strong></div>
          <div>Overseas: <strong id="os-count" style="color:#e84393;">0/6</strong></div>
        </div>
        <div class="squad-box" id="my-squad">Squad me abhi koi player nahi hai.</div>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let isHost = false;
    let myData = null;

    // Web Audio Beep Sound
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBidSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(850, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function createRoom() {
      const roomCode = document.getElementById('room-input').value.trim();
      const teamName = document.getElementById('team-name').value.trim();
      const maxTeams = document.getElementById('max-teams').value;
      if (!roomCode) return alert('Room code daaliye!');
      socket.emit('create-room', { roomCode, teamName, maxTeams });
    }

    function joinRoom() {
      const roomCode = document.getElementById('room-input').value.trim();
      const teamName = document.getElementById('team-name').value.trim();
      if (!roomCode) return alert('Room code daaliye!');
      socket.emit('join-room', { roomCode, teamName });
    }

    socket.on('error-msg', (msg) => alert(msg));

    socket.on('room-joined', ({ roomCode, user, isHost: hostStatus, maxTeams, totalPlayers }) => {
      myData = user;
      isHost = hostStatus;
      document.getElementById('lobby-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      document.getElementById('status').innerText = `Room: ${roomCode} | Teams ka wait ho raha hai (${maxTeams} Teams)...`;

      if (isHost) {
        document.getElementById('host-controls').classList.remove('hidden');
      }
    });

    socket.on('game-started', () => {
      document.getElementById('status').innerText = "🔥 Mega Auction Live!";
    });

    socket.on('new-player', ({ player, currentBid, index, total }) => {
      document.getElementById('player-name').innerText = player.name;
      document.getElementById('player-role').innerText = player.role;
      document.getElementById('player-img').src = player.img;
      document.getElementById('player-progress').innerText = `Player ${index} / ${total}`;
      
      const cBadge = document.getElementById('player-country');
      cBadge.innerText = player.country;
      cBadge.className = player.isOverseas ? "badge badge-os" : "badge badge-ind";

      document.getElementById('current-bid').innerText = currentBid;
      document.getElementById('bid-leader').innerText = "None";
      document.getElementById('bid-btn').disabled = false;
    });

    socket.on('timer-tick', (time) => {
      document.getElementById('timer').innerText = time;
    });

    socket.on('bid-placed', ({ currentBid, highestBidder }) => {
      playBidSound();
      document.getElementById('current-bid').innerText = currentBid;
      document.getElementById('bid-leader').innerText = highestBidder;
    });

    socket.on('player-sold', ({ player, winner, price }) => {
      alert(`🎉 SOLD! ${player.name} (${player.country}) sold to ${winner} for ₹${price}L`);
    });

    socket.on('player-unsold', ({ player }) => {
      alert(`❌ UNSOLD! ${player.name}`);
    });

    socket.on('update-users', (users) => {
      if (myData && users[socket.id]) {
        myData = users[socket.id];
        document.getElementById('my-purse').innerText = `₹ ${myData.purse}L`;
        document.getElementById('squad-count').innerText = `${myData.squad.length}/16`;
        document.getElementById('os-count').innerText = `${myData.overseasCount}/6`;
        document.getElementById('my-squad').innerHTML = myData.squad.map(p => 
          `• ${p.name} [${p.country}] (${p.role}) - ₹${p.price}L`
        ).join('<br>') || 'None';
      }
    });

    socket.on('auction-ended', () => {
      alert('🏆 Mega Auction Khatam!');
      setTimeout(() => location.reload(), 2000);
    });

    function sendBid() {
      socket.emit('place-bid');
    }

    function soldPlayer() {
      socket.emit('host-action-sold');
    }

    function unsoldPlayer() {
      socket.emit('host-action-unsold');
    }
  </script>
</body>
  </html>
